<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Security Research & Defense Portfolio</title>
    <meta name="description" content="APT 분석, 취약점 리서치, BAS 시뮬레이션, 악성코드 분석 포트폴리오" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" />
    <style>
      :root {
        /* -- Base -- */
        --base-background-color: #0d1117;
        --base-color: #c9d1d9;
        --base-font-size: 15px;
        --base-line-height: 1.7;

        /* -- Theme -- */
        --theme-color: #58a6ff;
        --theme-accent: #7ee787;

        /* -- Sidebar -- */
        --sidebar-background: #161b22;
        --sidebar-border-color: #30363d;
        --sidebar-border-width: 1px;
        --sidebar-width: 280px;
        --sidebar-nav-link-color: #8b949e;
        --sidebar-nav-link-color--active: #58a6ff;
        --sidebar-nav-link-font-weight--active: 600;
        --sidebar-nav-strong-color: #f0f6fc;
        --sidebar-nav-strong-font-size: 13px;
        --sidebar-nav-strong-margin: 18px 0 6px 0;

        /* -- Content -- */
        --content-max-width: 860px;

        /* -- Heading -- */
        --heading-color: #f0f6fc;
        --heading-h1-border-color: #30363d;
        --heading-h1-border-width: 0 0 1px 0;
        --heading-h1-font-size: 2em;
        --heading-h2-font-size: 1.5em;
        --heading-h2-border-color: #21262d;
        --heading-h2-border-width: 0 0 1px 0;
        --heading-h2-padding: 0 0 8px 0;

        /* -- Code -- */
        --code-theme-background: #161b22;
        --code-inline-background: #1c2128;
        --code-inline-color: #79c0ff;
        --code-inline-border-radius: 4px;
        --code-inline-padding: 2px 6px;
        --code-block-border-radius: 8px;
        --code-block-padding: 16px 20px;

        /* -- Blockquote -- */
        --blockquote-border-color: #58a6ff;
        --blockquote-border-width: 0 0 0 4px;
        --blockquote-background: rgba(88, 166, 255, 0.06);
        --blockquote-border-radius: 0 8px 8px 0;

        /* -- Table -- */
        --table-head-background: #161b22;
        --table-head-color: #f0f6fc;
        --table-cell-border-color: #30363d;
        --table-body-border-color: #30363d;

        /* -- Notice / Alerts -- */
        --notice-tip-border-color: #7ee787;
        --notice-important-border-color: #d29922;

        /* -- Link -- */
        --link-color: #58a6ff;
        --link-text-decoration: none;

        /* -- Cover -- */
        --cover-background-color: #0d1117;
        --cover-heading-color: #f0f6fc;
        --cover-color: #8b949e;
        --cover-max-width: 640px;
        --cover-button-background: #58a6ff;
        --cover-button-color: #0d1117;
        --cover-button-border: none;
        --cover-button-border-radius: 8px;
        --cover-button-padding: 10px 32px;

        /* -- Scrollbar -- */
        --scrollbar-track-background: #0d1117;
        --scrollbar-thumb-background: #30363d;
        --scrollbar-thumb-background--hover: #484f58;
      }

      /* ===== Global ===== */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== Sidebar ===== */
      .sidebar {
        border-right: 1px solid #30363d;
      }
      .app-name-link {
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.3px;
      }
      .sidebar-nav li a {
        font-size: 13.5px;
        padding: 4px 0;
        transition: color 0.15s, padding-left 0.15s;
      }
      .sidebar-nav li a:hover {
        color: #58a6ff;
        padding-left: 4px;
      }
      .sidebar-nav li strong {
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1px;
        color: #484f58;
        margin-top: 16px;
        display: block;
      }

      /* ===== Content ===== */
      .markdown-section {
        padding: 30px 40px 60px;
      }
      .markdown-section h1 {
        margin-top: 0;
        padding-bottom: 12px;
      }
      .markdown-section h2 {
        margin-top: 36px;
      }

      /* ===== Tables ===== */
      .markdown-section table {
        display: table;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #30363d;
        margin: 16px 0;
      }
      .markdown-section table th {
        background: #161b22;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 10px 14px;
      }
      .markdown-section table td {
        padding: 10px 14px;
        font-size: 14px;
        border-top: 1px solid #21262d;
      }
      .markdown-section table tr:hover td {
        background: rgba(88, 166, 255, 0.04);
      }

      /* ===== Code Blocks ===== */
      .markdown-section pre {
        border: 1px solid #30363d;
        position: relative;
      }
      .markdown-section code {
        font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 13px;
      }

      /* ===== Links ===== */
      .markdown-section a {
        transition: color 0.15s;
        border-bottom: 1px solid transparent;
      }
      .markdown-section a:hover {
        color: #79c0ff;
        border-bottom-color: #79c0ff;
      }

      /* ===== Blockquotes ===== */
      .markdown-section blockquote {
        padding: 12px 20px;
        margin: 16px 0;
      }
      .markdown-section blockquote p {
        margin: 4px 0;
      }

      /* ===== Download Button ===== */
      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #238636, #2ea043);
        color: #ffffff !important;
        padding: 8px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none !important;
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.2s;
        margin: 4px 4px 4px 0;
      }
      .download-btn:hover {
        background: linear-gradient(135deg, #2ea043, #3fb950);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        border-bottom-color: transparent !important;
      }
      .download-btn::before {
        content: '\2B07';
        font-size: 14px;
      }

      /* ===== Info Badge ===== */
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .badge-blue { background: rgba(88,166,255,0.15); color: #58a6ff; }
      .badge-green { background: rgba(126,231,135,0.15); color: #7ee787; }
      .badge-red { background: rgba(248,81,73,0.15); color: #f85149; }
      .badge-yellow { background: rgba(210,153,34,0.15); color: #d29922; }
      .badge-purple { background: rgba(188,140,255,0.15); color: #bc8cff; }

      /* ===== Card Grid ===== */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin: 20px 0;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 20px;
        transition: all 0.2s;
      }
      .card:hover {
        border-color: #58a6ff;
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      }
      .card h4 {
        margin: 0 0 8px;
        color: #f0f6fc;
      }
      .card p {
        margin: 0;
        font-size: 13px;
        color: #8b949e;
        line-height: 1.5;
      }

      /* ===== Cover Page ===== */
      .cover-main {
        text-align: center;
      }
      .cover-main h1 {
        font-size: 2.8em;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #58a6ff, #7ee787);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .cover-main blockquote p {
        font-size: 1.1em;
        color: #8b949e;
      }
      .cover-main > p:last-of-type a {
        background: #58a6ff;
        color: #0d1117 !important;
        padding: 10px 32px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
        border: none !important;
        margin: 0 6px;
      }
      .cover-main > p:last-of-type a:last-child {
        background: transparent;
        color: #58a6ff !important;
        border: 1px solid #30363d !important;
      }
      .cover-main > p:last-of-type a:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
      }

      /* ===== Search ===== */
      .search input {
        background: #0d1117 !important;
        border: 1px solid #30363d !important;
        border-radius: 8px !important;
        color: #c9d1d9 !important;
        padding: 8px 12px !important;
        font-size: 13px !important;
      }
      .search input:focus {
        border-color: #58a6ff !important;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15) !important;
      }
      .matching-post {
        border-bottom-color: #21262d !important;
      }

      /* ===== Scrollbar ===== */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0d1117; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #484f58; }

      /* ===== Responsive ===== */
      @media (max-width: 768px) {
        .markdown-section { padding: 20px 16px 40px; }
        .card-grid { grid-template-columns: 1fr; }
        .cover-main h1 { font-size: 2em; }
      }

      /* ===== Copy Code Button ===== */
      .docsify-copy-code-button {
        font-size: 12px !important;
        border-radius: 6px !important;
        background: #21262d !important;
        color: #8b949e !important;
        border: 1px solid #30363d !important;
      }
      .docsify-copy-code-button:hover {
        background: #30363d !important;
        color: #c9d1d9 !important;
      }

      /* ===== Pagination ===== */
      .docsify-pagination-container {
        border-top-color: #21262d !important;
        margin-top: 40px !important;
      }
      .pagination-item-label {
        color: #8b949e !important;
        font-size: 12px !important;
      }
      .pagination-item-title {
        color: #58a6ff !important;
        font-size: 15px !important;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading...</div>
    <script>
      window.$docsify = {
        name: '<span style="background:linear-gradient(135deg,#58a6ff,#7ee787);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Security Portfolio</span>',
        repo: 'https://github.com/ibamin/portfolio',
        loadSidebar: true,
        coverpage: true,
        onlyCover: false,
        subMaxLevel: 3,
        auto2top: true,
        search: {
          placeholder: 'Search techniques, tools...',
          noData: 'No results found',
          depth: 4
        },
        copyCode: {
          buttonText: 'Copy',
          successText: 'Copied!'
        },
        pagination: {
          previousText: 'PREV',
          nextText: 'NEXT',
          crossChapter: true,
          crossChapterText: true
        },
        tabs: {
          persist: true,
          sync: false,
          theme: 'material'
        }
      }
    </script>
    <!-- Core -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
    <!-- Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ruby.min.js"></script>
  </body>
</html>
